# Omactivity: protected processes.
#
# Quitting one of these takes the session or the system down, so Omactivity
# asks first and shows the text below. Nothing here is ever refused.
#
# One process per line: the process name as the kernel reports it (the first
# 15 characters of the program name), a colon, then what will happen.
# @init is PID 1 and @self is Omactivity; both are always protected.

@init: This is the first process of the system. Everything stops and the device has to be restarted.
@self: This is Omactivity itself. It will close.

labwc: labwc is the compositor. The screen will go black and you will be logged out. Unsaved work in every open app is lost.
Hyprland: Hyprland is the compositor. The screen will go black and you will be logged out. Unsaved work in every open app is lost.
quickshell: Quickshell draws the bar, the menu and the on-screen keyboard. They disappear until the shell is started again.
.quickshell-wra: Quickshell draws the bar, the menu and the on-screen keyboard. They disappear until the shell is started again.
qs: Quickshell draws the bar, the menu and the on-screen keyboard. They disappear until the shell is started again.
greetd: greetd is the login screen. You may be logged out and unable to log in again until the device is restarted.
systemd-logind: systemd-logind manages your session. You may be logged out, and sleep and the power button stop working.
dbus-daemon: D-Bus carries messages between apps and the system. Most apps and the session stop working.
dbus-broker: D-Bus carries messages between apps and the system. Most apps and the session stop working.
dbus-broker-lau: D-Bus carries messages between apps and the system. Most apps and the session stop working.
NetworkManager: NetworkManager runs Wi-Fi and every other connection. The device goes offline.
