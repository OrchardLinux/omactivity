name: build

# Every push and pull request builds the arm64 package and runs the tests.
# A tag vX.Y.Z also attests the package and drafts a release with it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    name: Package (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the versions agree
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' pkgbuild/PKGBUILD)
          app=$(sed -n 's/^VERSION = //p' omactivity.pro)
          echo "package $pkgver, app $app, ref $GITHUB_REF_NAME"
          [ -n "$pkgver" ] && [ "$pkgver" = "$app" ] || { echo "::error::pkgbuild/PKGBUILD and omactivity.pro disagree on the version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$pkgver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $pkgver"; exit 1
          fi

      - name: Build the package and run the tests
        run: |
          docker run --rm -v "$PWD:/src" -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            "$(cat pkgbuild/image)" /src/pkgbuild/build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omactivity-package
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attest and draft the release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the attestation as this workflow
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omactivity-package
          path: dist

      - name: Check the package against its checksum
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest the build
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # The same attestation as a file next to the package, for checking
      # without asking GitHub.
      - name: Add the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/omactivity-${GITHUB_REF_NAME#v}.sigstore.jsonl"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Omactivity ${GITHUB_REF_NAME#v}" --generate-notes
